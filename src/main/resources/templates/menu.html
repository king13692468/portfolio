<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${user.name} + ' - Portfolio'"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        .menu-container { max-width: 500px; margin: auto; }
        h1 { color: #333; }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            box-sizing: border-box;
        }
        .menu-btn:hover { background-color: #0056b3; }
        .add-project-btn {
            background-color: #28a745;
        }
        .add-project-btn:hover {
            background-color: #218838;
        }
        .logout-btn { background-color: #6c757d; }
        .logout-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
<div class="menu-container">
    <h1>Welcome, <span th:text="${user.name}"></span>!</h1>
    <p>What would you like to see?</p>

    <a th:href="${user.githubLink}" target="_blank" class="menu-btn">
        🔗 View GitHub Profile
    </a>

    <a th:href="${user.linkedinLink}" target="_blank" class="menu-btn">
        🔗 View LinkedIn Profile
    </a>

    <a th:href="@{/p/{username}/projects(username=${user.username})}" class="menu-btn">
        📁 View My Projects
    </a>

    <a th:href="${user.resumeLink}" target="_blank" class="menu-btn">
        📄 View Resume
    </a>

    <!-- ADD NEW PROJECT BUTTON - FIXED -->
    <a th:href="@{/create-project/{username}(username=${user.username})}" class="menu-btn add-project-btn">
        ➕ Add New Project
    </a>

    <br><br>
    <a href="/" class="menu-btn logout-btn">← Back to Home</a>
</div>
</body>
</html>
