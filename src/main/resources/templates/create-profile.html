<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Your Profile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; margin-top: 20px; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error { color: red; text-align: center; margin-top: 10px; }
        .back-link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Create Your Profile</h1>

    <form action="/create-profile" method="post">
        <label>Username (required):</label>
        <input type="text" name="username" placeholder="shadab" required>
        <small style="color: #666;">This will be your profile URL: /p/username</small>

        <label>Full Name (required):</label>
        <input type="text" name="name" placeholder="Shadab" required>

        <label>GitHub Link:</label>
        <input type="url" name="githubLink" placeholder="https://github.com/yourusername">

        <label>LinkedIn Link:</label>
        <input type="url" name="linkedinLink" placeholder="https://linkedin.com/in/yourusername">

        <label>Resume Link:</label>
        <input type="url" name="resumeLink" placeholder="https://drive.google.com/your-resume.pdf">

        <button type="submit">🚀 Create Profile</button>

        <div th:if="${param.error}" class="error">
            Username already exists! Please choose another.
        </div>
    </form>

    <div class="back-link">
        <a href="/">← Back to Home</a>
    </div>
</div>
</body>
</html>
